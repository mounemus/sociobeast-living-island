<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SocioBeast — The Living Island</title>
    <meta name="description" content="A living AI creature that develops its own mythology, dreams, and memories. Watch it evolve.">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap">
    <link rel="stylesheet" href="assets/style.css">
    <meta name="description" content="SocioBeast — The Living Island. A cosmic floating island where every TikTok viewer becomes a guardian spirit. Browser demo.">
    <meta property="og:title" content="SocioBeast — The Living Island">
    <meta property="og:description" content="1000+ AI spirits, 4 clans, council votes, fractures. Interactive TikTok Live game by UbMaker.">
    <link rel="stylesheet" href="assets/game.css?v=16">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌲</text></svg>">
</head>
<body>
    <canvas id="creature-canvas"></canvas>

    <div id="audio-hint">🔊 Click anywhere to awaken the forest</div>
    <div id="load-status">Awakening spirits...</div>

    <div id="creature-expression">
        <div id="expression-inner">
            <div class="expr-header">
                <div class="expr-indicator"></div>
                <span class="expr-label" id="expr-mode">Thinking</span>
                <span class="expr-mood" id="expr-mood">😌 curious</span>
            </div>
            <div class="expr-body">
                <div id="expression-text"></div>
            </div>
        </div>
    </div>

    <div id="debug-panel" class="hidden">
        <div class="debug-header">
            <span>🔧 Debug</span>
            <button onclick="toggleDebug()">✕</button>
        </div>
        <div id="debug-content"></div>
        <div class="debug-controls">
            <button onclick="adminSpeak('monologue')" title="Monologue">💭</button>
            <button onclick="adminSpeak('prophecy')" title="Prophecy">🔮</button>
            <button onclick="adminSpeak('autonomous')" title="Thought">🤖</button>
            <button onclick="generateDream()" title="Dream">💤</button>
            <button onclick="generateMythology()" title="New Legend">📜</button>
            <button onclick="toggleVoice()" title="Voice">🔊</button>
        </div>
        <div id="debug-status"></div>
    </div>

    <script src="mock-api.js?v=1"></script>
    <script>
        // Configuration
        window.SOCIOBEAST_CONFIG = {
            voiceEnabled: true,
            subtitlesEnabled: true,
            demoMode: true,
            mythologyEnabled: true,
            streamingEnabled: false,
            creatureName: "SocioBeast",
            autonomyTickMs: 30000,
            apiBase: ''
        };

        // Initial state for visual restoration
        window.INITIAL_STATE = null;

        // Loading logger
        window._loadLog = function(msg) {
            var el = document.getElementById('load-status');
            if (el) el.textContent = msg;
            console.log('[LOAD] ' + msg);
        };

        // Hide audio hint on click
        document.addEventListener('click', function() {
            var hint = document.getElementById('audio-hint');
            if (hint) hint.classList.add('hidden');
        }, { once: true });
    </script>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
            onerror="window._loadLog('ERROR: Three.js failed to load')"></script>

    <!-- Verify THREE -->
    <script>
    if (typeof THREE === 'undefined') {
        window._loadLog('THREE not loaded! Trying backup...');
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';
        s.onerror = function() { window._loadLog('FATAL: Cannot load Three.js'); };
        document.head.appendChild(s);
    } else {
        window._loadLog('THREE r' + THREE.REVISION + ' ready');
    }
    </script>

    <!-- GLTFLoader -->
    <script>
    function loadGLTFLoader() {
        return new Promise(function(resolve, reject) {
            if (typeof THREE === 'undefined') { reject('THREE missing'); return; }
            if (typeof THREE.GLTFLoader !== 'undefined') { resolve(); return; }

            var urls = [
                'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js',
                'https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js'
            ];

            function tryNext(idx) {
                if (idx >= urls.length) { reject('GLTFLoader failed'); return; }
                window._loadLog('Loading GLTFLoader...');
                var s = document.createElement('script');
                s.src = urls[idx];
                s.onload = function() {
                    if (typeof THREE.GLTFLoader !== 'undefined') {
                        window._loadLog('GLTFLoader ready');
                        resolve();
                    } else {
                        tryNext(idx + 1);
                    }
                };
                s.onerror = function() { tryNext(idx + 1); };
                document.head.appendChild(s);
            }
            tryNext(0);
        });
    }

    function bootApp() {
        if (typeof THREE === 'undefined') {
            window._loadLog('Waiting for THREE...');
            setTimeout(bootApp, 200);
            return;
        }
        
        function loadPostFX() {
            var base = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/';
            var files = ['shaders/CopyShader.js', 'shaders/LuminosityHighPassShader.js', 'postprocessing/EffectComposer.js', 'postprocessing/RenderPass.js', 'postprocessing/ShaderPass.js', 'postprocessing/UnrealBloomPass.js'];
            return files.reduce(function(pr, f) { return pr.then(function() { return new Promise(function(res) { var sc = document.createElement('script'); sc.src = base + f; sc.onload = res; sc.onerror = res; document.head.appendChild(sc); }); }); }, Promise.resolve());
        }
        loadGLTFLoader().then(loadPostFX).then(function() {
            window._loadLog('Loading visual engine...');
            
            // Load scripts in order
            var scripts = ['assets/visualEngine.js?v=14', 'assets/speech.js', 'assets/ui.js', 'assets/app.js?v=14', 'assets/gameEngine.js?v=16'];
            var loaded = 0;
            
            function loadNext() {
                if (loaded >= scripts.length) return;
                var s = document.createElement('script');
                s.src = scripts[loaded];
                s.onload = function() {
                    loaded++;
                    if (loaded < scripts.length) {
                        setTimeout(loadNext, 50);
                    }
                };
                s.onerror = function() { window._loadLog('ERROR: ' + scripts[loaded] + ' failed'); };
                document.body.appendChild(s);
            }
            loadNext();
        }).catch(function(err) {
            window._loadLog('ERROR: ' + err);
        });
    }

    bootApp();
    </script>
</body>
</html>
