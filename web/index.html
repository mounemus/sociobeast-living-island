<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SocioBeast — a creature raised by TikTok Live</title>
    <meta name="description" content="SocioBeast is a living 3D creature raised by a TikTok Live audience: likes feed it, comments make it talk, gifts make it evolve. By UbMaker.">
    <meta property="og:title" content="SocioBeast — a creature raised by TikTok Live">
    <meta property="og:description" content="Feed it with ❤️, talk to it in the chat, evolve it with gifts. It gets hungry, sleeps, remembers its keepers and acts on its own.">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap">
    <link rel="stylesheet" href="assets/beast.css?v=21">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥚</text></svg>">
</head>
<body>
    <canvas id="scene"></canvas>
    <div id="load">Waking the beast…</div>

    <div id="hud">
        <div id="top">
            <div id="h-title" class="row"><span><span id="h-name">SocioBeast</span><span id="h-stage">Egg</span></span><span class="r"><span id="h-mood"></span><span id="h-keepers">0 keepers</span><span id="h-live">Demo</span></span></div>
            <div><div class="bar"><div id="h-xp"></div></div><div id="h-xp-txt" class="num"></div></div>
            <div id="h-vitals" class="panel">
                <div class="vital" id="v-food"><div class="row"><span>❤️ Food</span><span>likes</span></div><div class="bar"><div id="h-food"></div></div></div>
                <div class="vital" id="v-joy"><div class="row"><span>💬 Joy</span><span>comments</span></div><div class="bar"><div id="h-joy"></div></div></div>
                <div class="vital" id="v-energy"><div class="row"><span>⚡ Energy</span><span>sleep · gifts</span></div><div class="bar"><div id="h-energy"></div></div></div>
            </div>
        </div>
        <div id="bubble" class="bubble hidden"></div>
        <div id="bubble-pip" class="bubble pip hidden"></div>
        <div id="bubble-moss" class="bubble moss hidden"></div>
        <div id="poll" class="panel hidden"></div>
        <div id="keepers" class="panel"></div>
        <div id="feed"></div>
        <div id="banner" class="hidden"></div>
        <div id="cta"></div>
        <div id="help"><span>? keys</span><div class="keys"><kbd>H</kbd>hide HUD<br><kbd>L</kbd>25 likes<br><kbd>G</kbd>Galaxy gift<br><kbd>E</kbd>force evolution<br><kbd>P</kbd>next show beat<br><kbd>V</kbd>voice on/off<br><kbd>R</kbd>reset to egg</div></div>
    </div>

    <script>
        // mode=live is set by the PHP page; the static page is the demo (?live=1 also works behind the PHP relay)
        var q = new URLSearchParams(location.search);
        window.BEAST_CONFIG = window.BEAST_CONFIG || { mode: q.get('live') === '1' ? 'live' : 'demo', voice: q.get('voice') === '1', ai: q.get('ai') !== '0', name: q.get('name') || 'SocioBeast' };
        function loadScript(src) { return new Promise(function(res, rej) { var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function() { rej(src); }; document.head.appendChild(s); }); }
        function loadSeq(list) { return list.reduce(function(p, f) { return p.then(function() { return loadScript(f); }); }, Promise.resolve()); }
        var fx = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/';
        loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js')
          .catch(function() { return loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'); })
          .then(function() { return loadSeq(['shaders/CopyShader.js', 'shaders/LuminosityHighPassShader.js', 'postprocessing/EffectComposer.js', 'postprocessing/RenderPass.js', 'postprocessing/ShaderPass.js', 'postprocessing/UnrealBloomPass.js'].map(function(f) { return fx + f; })).catch(function() {}); })
          .then(function() { return loadSeq(['assets/creature.js?v=21', 'assets/cast.js?v=21', 'assets/game.js?v=21', 'assets/director.js?v=21', 'assets/audience.js?v=21']); })
          .then(function() { document.getElementById('load').classList.add('hidden'); })
          .catch(function(e) { document.getElementById('load').textContent = 'Could not load ' + e; });
    </script>
</body>
</html>
