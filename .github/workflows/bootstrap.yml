name: bootstrap-import-v15
on:
  push:
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import v15 files and push
        run: |
          curl -sL -o r.zip "https://upload.higgsfield.ai/user_3G0gtr5tdjlbOmgsZ7fQhn2YodW/173e291b-3407-43f0-93a0-6113fe7d4c9b.zip"
          unzip -oq r.zip && cp -r repo/. . && rm -rf repo r.zip .github/workflows/bootstrap.yml
          git checkout -- .github/workflows/ci.yml 2>/dev/null || true
          git config user.name "Abdel-Mounem Taouai"
          git config user.email "taouai@users.noreply.github.com"
          git add -A
          git commit -m "feat(v15): painted cast and cosmic sky generated on Higgsfield, sprite billboards, exposure/bloom tuning"
          git push
