name: bootstrap-import-v2
on:
  push:
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import project files and push
        run: |
          curl -sL -o r.zip "https://upload.higgsfield.ai/user_3G0gtr5tdjlbOmgsZ7fQhn2YodW/7cbfc824-848d-47b2-9d91-4922dc152d3b.zip"
          unzip -oq r.zip && cp -r repo/. . && rm -rf repo r.zip .gitkeep-init .github/workflows/bootstrap.yml .github/workflows/ci.yml
          git config user.name "Abdel-Mounem Taouai"
          git config user.email "taouai@users.noreply.github.com"
          git add -A
          git commit -m "feat: SocioBeast - The Living Island v12 (TikTok Live game, PHP server, Node bridge, Vercel demo)"
          git push
