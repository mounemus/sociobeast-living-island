name: bootstrap-import-v14
on:
  push:
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import v14 files and push
        run: |
          curl -sL -o r.zip "https://upload.higgsfield.ai/user_3G0gtr5tdjlbOmgsZ7fQhn2YodW/3d0184c9-6129-4d32-aa73-dc7a65a4699d.zip"
          unzip -oq r.zip && cp -r repo/. . && rm -rf repo r.zip .github/workflows/bootstrap.yml
          git checkout -- .github/workflows/ci.yml 2>/dev/null || true
          git config user.name "Abdel-Mounem Taouai"
          git config user.email "taouai@users.noreply.github.com"
          git add -A
          git commit -m "feat(v14): Nature Plays - Island Director (chapters, autonomous moves, original cast), cinematic 3D, admin control room + TikTok panel"
          git push
