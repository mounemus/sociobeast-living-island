name: CI
on: [push, pull_request]
jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: JS syntax check
        run: for f in web/assets/*.js api/*.js server/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Evolution rules self-test
        run: |
          node -e "import('./web/assets/evolution.js').then(() => process.exit(Evolution.check() ? 0 : 1))"
      - name: Server rules function self-test
        run: node scripts/test-event-function.mjs
      - name: Home server smoke test
        run: |
          cd server && npm install --omit=dev --no-audit --no-fund && cd ..
          node server/server.js --demo > /tmp/server.log 2>&1 &
          sleep 3
          curl -sf http://127.0.0.1:8420/ | grep -q 'BEAST_CONFIG'
          curl -sf http://127.0.0.1:8420/api/status | grep -q '"demo"'
          curl -sf http://127.0.0.1:8420/admin | grep -q 'SocioBeast'
      - name: Build Vercel demo
        run: bash scripts/build-web.sh
